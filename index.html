<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save our date — Diana and Elias, August 7, 2027 in SPS, Honduras."
    />
    <meta name="theme-color" content="#570007" />
    <title>Diana &amp; Elias — Save Our Date</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23570007'/%3E%3Cpath d='M12 20h40v27H12z' fill='%23eaf3f5'/%3E%3Cpath d='m12 21 20 16 20-16' fill='none' stroke='%23a4bdc8' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20260923-1" />
  </head>
  <body>
    <main class="experience" aria-live="polite">
      <section class="mail-scene" id="mailScene" aria-label="Diana and Elias save the date">
        <div class="envelope-rig" id="envelopeRig">
          <div class="envelope-back" aria-hidden="true"></div>

          <div class="card-sleeve" id="cardSleeve">
            <article class="save-card" id="saveCard" aria-hidden="true" inert>
              <div class="save-heading" aria-label="Save our date">
                <span>SAVE</span><span>OUR</span><span>DATE</span>
              </div>

              <div class="card-middle">
                <h1>Diana<br />&amp; Elias</h1>
                <figure class="polaroid">
                  <img src="assets/diana-elias.png" alt="Diana and Elias smiling together" />
                </figure>
              </div>

              <div class="card-footer">
                <p>SPS, HONDURAS<br />AUGUST 7, 2027</p>
                <button class="rsvp-seal" id="rsvpSeal" type="button" aria-label="Open the RSVP">
                  <img src="assets/rsvp-plaque.png" alt="RSVP" />
                  <span>OPEN RSVP</span>
                </button>
              </div>
            </article>
          </div>

          <div class="envelope-flap" aria-hidden="true">
            <img src="assets/envelope-flap-v2.png" alt="" />
          </div>

          <div class="envelope-pocket" aria-hidden="true">
            <img src="assets/open-envelope.png" alt="" />
          </div>

          <div class="envelope-address" aria-hidden="true">
            <span class="envelope-kicker">FOR THE PEOPLE WE LOVE,</span>
            <span class="envelope-name">The Miselems</span>
          </div>

          <button class="envelope-trigger" id="envelopeTrigger" type="button" aria-label="Open the envelope"></button>
          <span class="open-hint" aria-hidden="true">OPEN</span>
        </div>
      </section>

      <section class="final-card" id="finalCard" aria-label="Diana and Elias RSVP" aria-hidden="true">
        <img src="assets/ed-silver-paper.png" alt="Silver paper embossed with the initials E and D" />
      </section>
    </main>

    <dialog class="rsvp-dialog" id="rsvpDialog" aria-labelledby="rsvpTitle">
      <form class="rsvp-paper" id="rsvpForm" method="dialog" novalidate>
        <button class="close-dialog" id="closeDialog" type="button" aria-label="Close RSVP">&times;</button>

        <header class="rsvp-header">
          <h2 id="rsvpTitle">Will you join us?</h2>
          <p>An early read while we plan, the proper invitation, with all the details,<br />follows closer to the day.</p>
        </header>

        <div class="guest-search">
          <label for="guestName">LISTED</label>
          <div class="guest-field">
            <input
              id="guestName"
              name="guestName"
              type="text"
              placeholder="TYPE YOUR NAME"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="guestOptions"
              required
            />
            <ul class="guest-options" id="guestOptions" role="listbox" hidden></ul>
          </div>
          <span>CHANGE YOUR REPLY BELOW</span>
        </div>

        <fieldset class="reply-options">
          <legend>Choose your reply</legend>

          <label class="reply-card">
            <input type="radio" name="reply" value="attending" required />
            <span class="reply-title">Count us in</span>
            <span class="reply-note" id="attendingName">YOUR NAME</span>
          </label>

          <label class="reply-card">
            <input type="radio" name="reply" value="likely" />
            <span class="reply-title">Most likely</span>
            <span class="reply-note">PENCILED IN</span>
          </label>

          <label class="reply-card">
            <input type="radio" name="reply" value="declined" />
            <span class="reply-title">Sadly, no</span>
            <span class="reply-note">WE WILL MISS YOU</span>
          </label>
        </fieldset>

        <div class="form-footer">
          <p class="form-message" id="formMessage" role="status"></p>
          <button class="submit-rsvp" type="submit">Submit</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
